function getPlaceStyle(name){

if(n.includes('hotel')||n.includes('resort')||n.includes('m village')) return {emoji:'🏨',bg:'#ffe8a8'};
if(n.includes('train street')) return {emoji:'🚂',bg:'#e9e0d9'};

if(n.includes('restaurant')||n.includes('grill')||n.includes('bún')||n.includes('bun ')||n.includes('chả')||n.includes('cha ')||n.includes('lua')||n.includes('zoya')||n.includes('breakfast')||n.includes('lunch')||n.includes('dinner')) return {emoji:'🍽️',bg:'#ddf5e8'};
return {emoji:'📍',bg:'#dff2ff'};
}

function makeIcon(emoji,bg){return L.divIcon({className:'',html:`<div style="width:30px;height:30px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.12);font-size:14px">${emoji}</div>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-12]})}
function markerStyle(name){const x=getPlaceStyle(name);return [x.emoji,x.bg]}
function drawMap(id){if(!initMap())return;mapLayers.forEach(x=>map.removeLayer(x));mapLayers=[];let pts=[];const days=id===0?DAYS.slice(1):DAYS.filter(d=>d.id===id);days.forEach(d=>{let line=[];d.stops.forEach(s=>{if(typeof s[4]==='number'&&typeof s[5]==='number'){const p=[s[4],s[5]];pts.push(p);line.push(p);const [emoji,bg]=markerStyle(s[1]);const m=L.marker(p,{icon:makeIcon(emoji,bg)}).addTo(map).bindPopup(`<b>${emoji} ${s[1]}</b><br>${s[0]}<br>${s[2]}`);mapLayers.push(m)}});if(line.length>1){const pl=L.polyline(line,{weight:4,opacity:.7,color:'#7ab889',dashArray:'4 8'}).addTo(map);mapLayers.push(pl)}});if(pts.length>1)map.fitBounds(pts,{padding:[26,26]});else if(pts.length===1)map.setView(pts[0],13);setTimeout(()=>map.invalidateSize(),80)}
function applySaved(){document.querySelectorAll('.editable').forEach((el,i)=>{const k='edit-'+cur+'-'+i;const v=localStorage.getItem(k);if(v!==null)el.innerHTML=v;el.contentEditable=editing;el.oninput=()=>{localStorage.setItem(k,el.innerHTML);showSaved()}})}
function showSaved(){const h=document.getElementById('saveHint');h.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>h.classList.remove('show'),1200)}
function go(id){cur=id;[...tabs.children].forEach((b,i)=>b.classList.toggle('active',i===id));content.innerHTML=id===0?overview():render(DAYS.find(x=>x.id===id));applySaved();drawMap(id)}
document.getElementById('editBtn').onclick=()=>{editing=!editing;document.getElementById('editBtn').textContent=editing?'✅ 完成编辑':'✏️ 编辑计划';applySaved()};go(0);
</script></body></html>
