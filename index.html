<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vietnam 2026 · Hanoi × Phu Quoc</title>
<meta name="description" content="4人 · 2026/10/1–10/6 · 河内 × 富国岛旅行计划">
<style>
:root{--bg:#f5f0e6;--card:#fffdf8;--ink:#243229;--muted:#777168;--green:#315f47;--line:#e5ddd0;--red:#d95d55;--blue:#3d78b5;--grab:#1aa34a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,a{font:inherit}.wrap{max-width:760px;margin:auto;padding:20px 16px 50px}.hero{padding:20px 2px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em}.hero h1{font-size:34px;line-height:1.05;margin:10px 0 6px}.hero p{margin:0;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{background:#e6eee8;color:var(--green);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:3;padding:12px 0;background:rgba(245,240,230,.95);backdrop-filter:blur(12px)}.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 14px;border-radius:999px;white-space:nowrap;font-weight:700}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.section{margin-top:20px}.section h2{font-size:13px;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(40,35,25,.05)}.daytitle{font-size:22px;font-weight:800;margin-bottom:2px}.subtitle{color:var(--muted);font-size:13px}.stop{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.stop:first-child{border-top:0}.time{font-size:12px;color:var(--muted);font-weight:700}.name{font-weight:800}.desc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.google{background:#e9eff8;color:#265784}.amap{background:#e7f2ff;color:#1d69a7}.grab{background:#e5f5e9;color:#167037}.copy{background:#eee8dc;color:#5f584f}.editbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0}.editbar small{color:var(--muted)}.editbtn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.editable[contenteditable="true"]{outline:2px dashed #98b8a5;outline-offset:3px;border-radius:4px}.savehint{display:none;font-size:12px;color:var(--green);font-weight:700}.savehint.show{display:block}.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.overview-grid .card{margin:0}.k{font-size:11px;color:var(--muted);font-weight:800}.v{font-size:14px;font-weight:750;margin-top:4px;line-height:1.5}.todo{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.todo:first-child{border-top:0}.footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.6}@media(max-width:520px){.hero h1{font-size:30px}.stop{grid-template-columns:62px 1fr}.overview-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><div class="eyebrow">2026.10.01 — 10.06 · 4 PEOPLE</div><h1>Vietnam 2026</h1><p>Hanoi × Phu Quoc · 逛吃 · Safari · 日落 · 出海 · SPA</p><div class="chips"><span class="chip">约 ¥10,000 / 人</span><span class="chip">轻松不赶路</span><span class="chip">White Lotus vibe</span></div></section>
<div class="editbar"><small>行程内容可在本机临时编辑并保存</small><button class="editbtn" id="editBtn">编辑计划</button></div><div class="savehint" id="saveHint">已保存到这台设备</div>
<nav class="tabs" id="tabs"></nav><section id="content"></section>
<div class="footer">导航说明：高德适合国内网络环境；到越南后 Google Maps / Grab 更实用。网页本身不依赖外部 JS/CSS CDN，因此即使地图服务打不开，行程内容仍能正常显示。</div>
</main>
<script>
const DAYS=[
{id:0,label:'总览',title:'河内 × 富国岛 国庆旅行'},
{id:1,label:'10/1',title:'逛裙子 + 火车街 + 河内菜',city:'河内',stops:[
['10:00','La Mejor Indochine Hotel','自然醒，慢慢开始第一天。','La Mejor Indochine Hotel Hanoi'],
['11:00','Bún Chả · Old Quarter','老城区顺路吃，不为了名店绕路。','Bun Cha Old Quarter Hanoi'],
['12:15','GIANA HANOI','GIANA → Nhà Chung / Hội Vũ 一带逛裙子。','GIANA HANOI 15 Ngo Hoi Vu Hanoi'],
['15:30','Café Giảng','还剑湖附近喝蛋咖啡。','Cafe Giang 39 Nguyen Huu Huan Hanoi'],
['17:00','Hanoi Train Street','当天让酒店确认火车经过时间，再决定几点过去。','Hanoi Train Street'],
['19:30','Chả Cá Thăng Long','经典 Chả Cá 晚餐。','Cha Ca Thang Long 21 Duong Thanh Hanoi'],
['21:00+','Nectar Hideaway','可选；累了就直接回酒店。','Nectar Hideaway Hanoi']]},
{id:2,label:'10/2',title:'巴亭半日 + 飞富国岛',city:'河内 → 富国岛',stops:[
['09:00','早餐 / Coffee','酒店附近解决。','Old Quarter Hanoi coffee'],
['10:00–12:00','Ba Đình Square','巴亭广场 → 胡志明陵外围 → 可选升龙皇城。','Ba Dinh Square Hanoi'],
['12:30–14:00',"Hong Hoai's Restaurant",'20 Bát Đàn。',"Hong Hoai's Restaurant Hanoi"],
['16:00','Leave for HAN','周五晚高峰，预留充足 buffer。','Noi Bai International Airport'],
['20:05–22:10','HAN → PQC','飞富国岛。','Phu Quoc International Airport'],
['23:00','M Village Phu Quoc','入住后直接休息。','M Village Phu Quoc 189 Tran Hung Dao']]},
{id:3,label:'10/3',title:'Safari → New World → 日落',city:'富国岛',stops:[
['09:00–12:00','Vinpearl Safari Phu Quoc','Safari Bus + 动物秀；临近出发再核对官方时刻。','Vinpearl Safari Phu Quoc'],
['12:00–14:00','North → South transfer','跨岛南下。','New World Phu Quoc Resort'],
['15:00','New World Phu Quoc Resort','入住 Villa / 私人泳池 / 换衣服。','New World Phu Quoc Resort'],
['16:00–17:30','Hon Thom Cable Car / Sunset Town','临近出发再次确认缆车运营时间。','Hon Thom Cable Car Phu Quoc'],
['17:30–18:15','Kiss Bridge / Sunset Town','留到真正日落。','Kiss Bridge Phu Quoc'],
['19:00','LUA Grill & Bar','优先；Kaisun 作为 backup。','LUA Grill Bar New World Phu Quoc']]},
{id:4,label:'10/4',title:'南岛出海一整天',city:'富国岛',stops:[
['08:00','New World Breakfast','酒店早餐。','New World Phu Quoc Resort'],
['09:00','Private Catamaran / Speedboat','氛围优先选私人双体帆船；浮潜优先选快艇。','An Thoi Port Phu Quoc'],
['09:30–15:30','Hon Gam Ghi','南岛浮潜重点。','Hon Gam Ghi Phu Quoc'],
['—','Hon May Rut Ngoai','沙滩与拍照。','Hon May Rut Ngoai Phu Quoc'],
['—','Hon Mong Tay','白沙浅滩。','Hon Mong Tay Phu Quoc'],
['16:00','Back to New World','洗澡、泳池、休息。','New World Phu Quoc Resort'],
['18:30–20:30','LUA / ZOYA','根据当天状态选一家。','New World Phu Quoc Resort']]},
{id:5,label:'10/5',title:'海滩 + SPA + 回程',city:'富国岛 → 河内',stops:[
['08:30–10:00','Breakfast','慢一点。','New World Phu Quoc Resort'],
['10:00–11:30','Khem Beach','最后的完整海滩时间。','Khem Beach Phu Quoc'],
['11:30–12:30','Pool','回 villa / pool。','New World Phu Quoc Resort'],
['13:00','Checkout + lunch','不再离开酒店太远。','New World Phu Quoc Resort'],
['14:00–15:30','Zen Spa','建议入住 New World 后立即预约。','Zen Spa New World Phu Quoc'],
['16:00','New World → PQC','机场班车至少提前 24h 预约。','Phu Quoc International Airport'],
['19:20–21:25','PQC → HAN','抵达后不住酒店，直接留机场。','Noi Bai International Airport']]},
{id:6,label:'10/6',title:'凌晨转机回上海',city:'河内 → 上海',stops:[
['00:00 前','Noi Bai T2','国际出发区候机。','Noi Bai International Airport Terminal 2'],
['01:20–05:35','HAN → PVG','回上海。','Shanghai Pudong International Airport']]}
];
const CHECKS=['10/1 当天让酒店确认 Train Street 火车时间','10/3 前一天确认 Safari / 缆车运营时刻','10/4 前 24–48h 看海况，必要时改 Resort / SPA','10/5 提前至少 24h 预约 New World → PQC shuttle','Zen Spa 入住后尽早预约'];
const tabs=document.getElementById('tabs'),content=document.getElementById('content');let cur=0,editing=false;
DAYS.forEach(d=>{const b=document.createElement('button');b.className='tab'+(d.id===0?' active':'');b.textContent=d.label;b.onclick=()=>go(d.id);tabs.appendChild(b)});
function q(s){return encodeURIComponent(s)}
function navButtons(dest){return `<div class="actions"><button class="btn google" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${q(dest)}','_blank')">Google Maps</button><button class="btn amap" onclick="window.open('https://www.amap.com/search?query=${q(dest)}','_blank')">高德地图</button><button class="btn grab" onclick="copyDest('${dest.replace(/'/g,"\\'")}')">Grab</button></div>`}
function copyDest(dest){navigator.clipboard?.writeText(dest).then(()=>alert('已复制目的地：'+dest+'\n打开 Grab 后粘贴搜索即可。')).catch(()=>prompt('复制到 Grab：',dest))}
function overview(){return `<div class="section"><div class="overview-grid"><div class="card"><div class="k">河内酒店</div><div class="v">La Mejor Indochine<br>10/1–10/2</div></div><div class="card"><div class="k">富国岛酒店</div><div class="v">M Village → New World<br>10/2–10/5</div></div><div class="card"><div class="k">核心节奏</div><div class="v">10/3 最长转场<br>10/4 只出海</div></div><div class="card"><div class="k">最后一天</div><div class="v">海滩 + SPA<br>16:00 去机场</div></div></div></div><div class="section"><h2>出发前确认</h2><div class="card">${CHECKS.map((x,i)=>`<label class="todo"><input type="checkbox" ${localStorage.getItem('ck'+i)==='1'?'checked':''} onchange="localStorage.setItem('ck${i}',this.checked?'1':'0')"><span>${x}</span></label>`).join('')}</div></div>`}
function render(d){return `<div class="card"><div class="daytitle editable">${d.title}</div><div class="subtitle editable">${d.city}</div>${d.stops.map((s,i)=>`<div class="stop"><div class="time editable">${s[0]}</div><div><div class="name editable">${s[1]}</div><div class="desc editable">${s[2]}</div>${navButtons(s[3])}</div></div>`).join('')}</div>`}
function applySaved(){document.querySelectorAll('.editable').forEach((el,i)=>{const k='edit-'+cur+'-'+i;const v=localStorage.getItem(k);if(v!==null)el.innerHTML=v;el.contentEditable=editing;el.oninput=()=>{localStorage.setItem(k,el.innerHTML);showSaved()}})}
function showSaved(){const h=document.getElementById('saveHint');h.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>h.classList.remove('show'),1200)}
function go(id){cur=id;[...tabs.children].forEach((b,i)=>b.classList.toggle('active',i===id));content.innerHTML=id===0?overview():render(DAYS.find(x=>x.id===id));applySaved()}
document.getElementById('editBtn').onclick=()=>{editing=!editing;document.getElementById('editBtn').textContent=editing?'完成编辑':'编辑计划';applySaved()};go(0);
</script></body></html>
